<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importador Contêiner</title>

<style>
body{
  margin:0;
  background:#071a36;
  font-family:Arial;
  color:#fff;
}

.wrap{
  padding:10px;
}

.btn{
  background:#3b73e6;
  border:0;
  padding:10px 14px;
  border-radius:10px;
  color:#fff;
  font-weight:bold;
}

.table-wrap{
  overflow:auto;
  max-height:70vh;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:8px;
  border-bottom:1px solid rgba(255,255,255,.1);
}

th{
  background:#0b2a59;
  position:sticky;
  top:0;
}

.thumb{
  width:45px;
  height:45px;
  border-radius:8px;
  object-fit:cover;
}

.thumb-placeholder{
  width:45px;
  height:45px;
  background:#0a1f43;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  border-radius:8px;
}

.descricao-traduzida{
  font-weight:bold;
}

.descricao-original{
  font-size:11px;
  color:#aaa;
}

</style>
</head>

<body>

<div class="wrap">

<input type="file" id="file">
<button class="btn" onclick="analisar()">Analisar</button>

<div class="table-wrap">
<table>
<thead id="thead"></thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<script>

let dados = [];
let headers = [];

async function analisar(){
  const file = document.getElementById("file").files[0];
  if(!file) return alert("Selecione arquivo");

  const form = new FormData();
  form.append("file", file);

  const res = await fetch("/api/importar-container", {
    method:"POST",
    body:form
  });

  const json = await res.json();

  dados = json.dados;
  headers = json.colunas;

  render();
}

function render(){

  const thead = document.getElementById("thead");
  const tbody = document.getElementById("tbody");

  // CABEÇALHO FIXO (SEM BAGUNÇA)
  thead.innerHTML = `
    <tr>
      <th>Imagem</th>
      <th>Código</th>
      <th>Descrição</th>
      <th>Caixas</th>
    </tr>
  `;

  tbody.innerHTML = dados.map(linha => {

    return `
      <tr>

        <!-- IMAGEM (TRAVADA NA LINHA) -->
        <td>
          ${
            linha.__imagem
              ? `<img src="${linha.__imagem}" class="thumb">`
              : `<div class="thumb-placeholder">sem</div>`
          }
        </td>

        <!-- CÓDIGO -->
        <td>${linha["ITEM NO"] || ""}</td>

        <!-- DESCRIÇÃO + ORIGINAL -->
        <td>
          <div class="descricao-traduzida">
            ${linha["DESCRIPTION"] || ""}
          </div>

          ${
            linha.__produto_original
              ? `<div class="descricao-original">${linha.__produto_original}</div>`
              : ""
          }
        </td>

        <!-- CAIXAS -->
        <td>${linha["CTNS"] || ""}</td>

      </tr>
    `;
  }).join("");
}

</script>

</body>
</html>
