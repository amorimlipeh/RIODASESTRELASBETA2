<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Importador Contêiner</title>
  <style>
    :root{
      --bg:#071a36;
      --panel:#0b2545;
      --line:#1d3c66;
      --text:#fff;
      --muted:#b9c7da;
      --btn:#3b73e6;
      --ok:#1f8f55;
      --err:#b33b3b;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    .wrap{
      padding:16px;
    }

    h1{
      margin:0 0 16px;
      font-size:28px;
    }

    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-bottom:14px;
    }

    .file-box{
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:44px;
      padding:10px 14px;
      border-radius:10px;
      background:var(--btn);
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }

    .file-box input{
      position:absolute;
      inset:0;
      opacity:0;
      cursor:pointer;
    }

    .btn{
      min-height:44px;
      padding:10px 14px;
      border:0;
      border-radius:10px;
      background:var(--btn);
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }

    .btn:disabled{
      opacity:.65;
      cursor:not-allowed;
    }

    .file-name{
      min-height:44px;
      display:flex;
      align-items:center;
      padding:10px 12px;
      border-radius:10px;
      background:#0d274c;
      border:1px solid rgba(255,255,255,.12);
      min-width:260px;
      max-width:100%;
      word-break:break-word;
    }

    .status{
      display:none;
      padding:12px 14px;
      border-radius:10px;
      margin-bottom:14px;
      border:1px solid rgba(255,255,255,.12);
      background:#10294d;
    }

    .status.show{ display:block; }
    .status.ok{ background:#103322; border-color:var(--ok); }
    .status.err{ background:#341515; border-color:var(--err); }
    .status.info{ background:#10294d; border-color:#355b9a; }

    .table-wrap{
      width:100%;
      overflow:auto;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background:#082048;
    }

    table{
      width:100%;
      min-width:760px;
      border-collapse:collapse;
    }

    th, td{
      padding:10px;
      border-bottom:1px solid var(--line);
      text-align:left;
      vertical-align:top;
    }

    th{
      background:#0b2a59;
      position:sticky;
      top:0;
      z-index:2;
    }

    .thumb{
      width:56px;
      height:56px;
      object-fit:cover;
      border-radius:8px;
      border:1px solid rgba(255,255,255,.12);
      background:#10294d;
      display:block;
    }

    .sem-img{
      width:56px;
      height:56px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,.12);
      background:#10294d;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#c7d4ea;
      font-size:10px;
      padding:4px;
    }

    .desc{
      font-weight:700;
      white-space:normal;
      line-height:1.2;
      min-width:180px;
    }

    .orig{
      margin-top:4px;
      font-size:11px;
      color:var(--muted);
      white-space:normal;
      line-height:1.2;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Importador Contêiner</h1>

    <div class="toolbar">
      <label class="file-box">
        Escolher arquivo
        <input id="file" type="file" accept=".xls,.xlsx,.csv" onchange="onArquivoSelecionado()" />
      </label>

      <div id="fileName" class="file-name">Nenhum arquivo selecionado</div>

      <button id="btnAnalisar" class="btn" type="button" onclick="analisarArquivo()">Analisar</button>
    </div>

    <div id="statusBox" class="status"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Imagem</th>
            <th>Código</th>
            <th>Descrição</th>
            <th>Caixas</th>
            <th>Linha Excel</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr>
            <td colspan="5">Aguardando análise do arquivo...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function $(id) {
      return document.getElementById(id);
    }

    function setStatus(tipo, texto) {
      const box = $("statusBox");
      if (!texto) {
        box.className = "status";
        box.textContent = "";
        return;
      }
      box.className = "status show " + tipo;
      box.textContent = texto;
    }

    function esc(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function onArquivoSelecionado() {
      const file = $("file").files && $("file").files[0];
      $("fileName").textContent = file ? file.name : "Nenhum arquivo selecionado";
      setStatus("", "");
    }

    function valorCodigo(row) {
      return row["ITEM NO"] || row["Item No"] || row["item no"] || row["客人货号"] || row["codigo"] || "";
    }

    function valorDescricao(row) {
      return row["DESCRIPTION"] || row["Description"] || row["品名"] || row["descricao"] || "";
    }

    function valorCaixas(row) {
      return row["CTNS"] || row["件数"] || row["caixas"] || "";
    }

    function renderTabela(dados) {
      const tbody = $("tbody");

      if (!Array.isArray(dados) || !dados.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5">Nenhum dado encontrado.</td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = dados.map((row) => {
        const imagem = row.__imagem || "";
        const codigo = valorCodigo(row);
        const descricao = valorDescricao(row);
        const original = row.__produto_original || "";
        const caixas = valorCaixas(row);
        const excelRow = row.__excelRow || "";

        return `
          <tr>
            <td>
              ${
                imagem
                  ? `<img src="${esc(imagem)}" class="thumb" alt="imagem" onerror="this.outerHTML='<div class=&quot;sem-img&quot;>Imagem inválida</div>'">`
                  : `<div class="sem-img">Sem imagem</div>`
              }
            </td>
            <td>${esc(codigo)}</td>
            <td>
              <div class="desc">${esc(descricao)}</div>
              ${original ? `<div class="orig">${esc(original)}</div>` : ""}
            </td>
            <td>${esc(caixas)}</td>
            <td>${esc(excelRow)}</td>
          </tr>
        `;
      }).join("");
    }

    async function analisarArquivo() {
      const input = $("file");
      const btn = $("btnAnalisar");
      const file = input.files && input.files[0];

      if (!file) {
        setStatus("err", "Selecione um arquivo antes de analisar.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Analisando...";
      setStatus("info", "Enviando arquivo para análise...");
      $("tbody").innerHTML = `
        <tr>
          <td colspan="5">Processando arquivo...</td>
        </tr>
      `;

      try {
        const form = new FormData();
        form.append("file", file);

        const res = await fetch("/api/importar-container", {
          method: "POST",
          body: form
        });

        let json;
        try {
          json = await res.json();
        } catch (e) {
          throw new Error("A resposta da API não veio em JSON.");
        }

        if (!res.ok || !json.ok) {
          throw new Error(json.erro || json.detalhe || "Falha ao analisar arquivo.");
        }

        renderTabela(json.dados || []);
        setStatus("ok", `Análise concluída. ${json.totalLinhas || (json.dados || []).length} linha(s) encontrada(s).`);
      } catch (err) {
        console.error(err);
        $("tbody").innerHTML = `
          <tr>
            <td colspan="5">Falha ao analisar o arquivo.</td>
          </tr>
        `;
        setStatus("err", err.message || "Erro inesperado.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Analisar";
      }
    }

    window.onArquivoSelecionado = onArquivoSelecionado;
    window.analisarArquivo = analisarArquivo;
  </script>
</body>
</html>
