<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Importador Contêiner</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    :root{
      --bg:#071a36;
      --panel:#0b2545;
      --line:#1d3c66;
      --text:#fff;
      --muted:#b9c7da;
      --btn:#3b73e6;
      --btn2:#24436c;
      --shadow:0 6px 22px rgba(0,0,0,.28);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      background:linear-gradient(180deg,#041229 0%,#071a36 100%);
      font-family:Arial,Helvetica,sans-serif;
      color:var(--text);
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px 16px;
      background:#12336b;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .topbar h1{
      margin:0;
      font-size:18px;
    }

    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:14px;
    }

    .card{
      background:rgba(6,24,54,.96);
      border:1px solid rgba(255,255,255,.08);
      border-radius:18px;
      padding:14px;
      box-shadow:var(--shadow);
      margin-bottom:14px;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .file-button-wrap{
      position:relative;
      display:inline-block;
      min-width:160px;
    }

    .fake-btn,
    .btn{
      background:var(--btn);
      color:#fff;
      border:0;
      border-radius:12px;
      padding:12px 16px;
      font-weight:700;
      cursor:pointer;
      box-shadow:var(--shadow);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:46px;
      text-align:center;
      user-select:none;
    }

    .btn.secondary{
      background:var(--btn2);
    }

    .btn.small{
      padding:8px 12px;
      min-height:auto;
      font-size:12px;
      border-radius:10px;
    }

    .btn:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .file-button-wrap input[type="file"]{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      opacity:0;
      cursor:pointer;
      z-index:3;
    }

    .statusbar,
    .select{
      width:100%;
      background:#173a6c;
      color:#fff;
      border:1px solid #2e548e;
      border-radius:14px;
      padding:14px 16px;
      font-size:15px;
    }

    .muted{
      color:var(--muted);
      margin-top:8px;
      font-size:13px;
    }

    .hidden{
      display:none !important;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      background:#183866;
      border-radius:999px;
      padding:10px 14px;
      color:#fff;
      font-size:13px;
    }

    .hint{
      background:#173a6c;
      border-radius:16px;
      padding:12px 16px;
      color:#d9e5ff;
      font-size:13px;
    }

    .loading-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:999;
      padding:14px;
    }

    .loading-box{
      width:min(92vw,420px);
      background:#0b2545;
      border:1px solid rgba(255,255,255,.1);
      border-radius:18px;
      padding:22px 18px;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
      text-align:center;
    }

    .spinner{
      width:56px;
      height:56px;
      border:5px solid rgba(255,255,255,.18);
      border-top-color:#4f8cff;
      border-radius:50%;
      margin:0 auto 16px;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      to{ transform:rotate(360deg); }
    }

    .progress{
      width:100%;
      height:12px;
      border-radius:999px;
      background:#163153;
      overflow:hidden;
      margin-top:14px;
    }

    .progress > div{
      height:100%;
      width:55%;
      background:linear-gradient(90deg,#2c7be5,#49c6ff);
      border-radius:999px;
      animation:progressMove 1.4s ease-in-out infinite;
    }

    @keyframes progressMove{
      0%{ transform:translateX(-55%); }
      100%{ transform:translateX(180%); }
    }

    .preview-shell{
      background:#071a36;
      border:1px solid rgba(255,255,255,.08);
      border-radius:18px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .preview-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:14px 16px;
      background:#12336b;
