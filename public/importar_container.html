<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importador Container</title>

<style>
body {
  background: #071a36;
  color: white;
  font-family: Arial;
}

table {
  width: 100%;
  border-collapse: collapse;
}

td, th {
  padding: 10px;
  border-bottom: 1px solid #1d3c66;
}

img {
  width: 50px;
  border-radius: 8px;
}
</style>
</head>

<body>

<h2>Importador Container</h2>

<input type="file" id="file">
<button onclick="enviar()">Analisar</button>

<table>
<thead>
<tr>
<th>Imagem</th>
<th>Código</th>
<th>Descrição</th>
<th>Qtd</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>
async function enviar() {
  const file = document.getElementById("file").files[0];
  const form = new FormData();
  form.append("file", file);

  const res = await fetch("/api/importar-container", {
    method: "POST",
    body: form
  });

  const json = await res.json();

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  json.dados.forEach(row => {

    const codigo = row["ITEM NO"] || row.codigo || "";
    const desc = row["DESCRIPTION"] || row.descricao || "";

    tbody.innerHTML += `
      <tr>
        <td>${row.__imagem ? `<img src="${row.__imagem}">` : "Sem imagem"}</td>
        <td>${codigo}</td>
        <td>
          <b>${desc}</b><br>
          <small style="opacity:.6">${row.__produto_original || ""}</small>
        </td>
        <td>${row.CTNS || row.caixas || ""}</td>
      </tr>
    `;
  });
}
</script>

</body>
</html>
