<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importador Contêiner</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#071a36;
  color:#fff;
}

.topbar{
  background:#12336b;
  padding:14px;
  display:flex;
  justify-content:space-between;
}

.btn{
  background:#3b73e6;
  border:none;
  color:#fff;
  padding:10px 14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.card{
  padding:14px;
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal{
  background:#071a36;
  width:95%;
  max-height:90vh;
  overflow:auto;
  border-radius:16px;
}

.hidden{ display:none }

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.img-thumb{
  width:60px;
  height:60px;
  border-radius:10px;
  object-fit:cover;
}

.desc-main{
  font-weight:bold;
}

.desc-original{
  font-size:11px;
  opacity:.6;
}

.filter-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

select{
  width:100%;
  padding:10px;
  border-radius:10px;
  background:#12336b;
  color:#fff;
  border:none;
}
</style>
</head>

<body>

<div class="topbar">
  <b>Importador Contêiner</b>
</div>

<div class="card">
  <input type="file" id="file">
  <button class="btn" onclick="analisar()">Analisar</button>
</div>

<!-- LOADING -->
<div id="loading" class="modal-backdrop hidden">
  <div class="modal" style="padding:30px;text-align:center">
    <h2>Carregando...</h2>
  </div>
</div>

<!-- PREVIEW -->
<div id="preview" class="modal-backdrop hidden">
  <div class="modal">

    <div class="topbar">
      <b>Pré-visualização</b>
      <div>
        <button class="btn" onclick="abrirFiltro()">Filtro</button>
        <button class="btn" onclick="fecharPreview()">Fechar</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

  </div>
</div>

<!-- FILTRO -->
<div id="filtro" class="modal-backdrop hidden">
  <div class="modal">

    <div class="topbar">
      <b>Filtro</b>
      <button class="btn" onclick="fecharFiltro()">Fechar</button>
    </div>

    <div class="card">

      <div class="filter-grid">
        <select id="codigo"></select>
        <select id="produto"></select>
        <select id="imagem"></select>
      </div>

    </div>

  </div>
</div>

<script>

let dados = [];
let headers = [];

function showLoading(v){
  document.getElementById("loading").classList.toggle("hidden", !v);
}

function analisar(){
  const file = document.getElementById("file").files[0];
  if(!file) return alert("Selecione arquivo");

  showLoading(true);

  const fd = new FormData();
  fd.append("arquivo", file);

  fetch("/api/importar-container",{method:"POST",body:fd})
  .then(r=>r.json())
  .then(res=>{
    showLoading(false);

    dados = res.planilhas[res.abas[0]];
    headers = Object.keys(dados[0] || {});

    montarTabela();
    montarSelects();

    document.getElementById("preview").classList.remove("hidden");
  })
  .catch(()=>{
    showLoading(false);
    alert("Erro ao analisar");
  });
}

function montarSelects(){
  const s1 = document.getElementById("codigo");
  const s2 = document.getElementById("produto");
  const s3 = document.getElementById("imagem");

  const opt = headers.map(h=>`<option>${h}</option>`).join("");

  s1.innerHTML = opt;
  s2.innerHTML = opt;
  s3.innerHTML = opt;
}

function montarTabela(){
  const thead = document.getElementById("thead");
  const tbody = document.getElementById("tbody");

  thead.innerHTML = "<tr>" + headers.map(h=>`<th>${h}</th>`).join("") + "</tr>";

  tbody.innerHTML = dados.map(row=>{
    return "<tr>" + headers.map(h=>{
      let val = row[h] || "";

      if(h.toLowerCase().includes("picture")){
        return `<td><img class="img-thumb" src="${val}" onerror="this.style.display='none'"></td>`;
      }

      return `<td>${val}</td>`;
    }).join("") + "</tr>";
  }).join("");
}

function abrirFiltro(){
  document.getElementById("filtro").classList.remove("hidden");
}

function fecharFiltro(){
  document.getElementById("filtro").classList.add("hidden");
}

function fecharPreview(){
  document.getElementById("preview").classList.add("hidden");
}

</script>

</body>
</html>
