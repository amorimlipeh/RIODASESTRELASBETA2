<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Importador Contêiner</title>
  <style>
    :root{--bg:#071a36;--panel:#0b2545;--panel2:#102d52;--line:#1d3c66;--text:#fff;--muted:#b9c7da;--btn:#3b73e6;--btn2:#295ec9;--shadow:0 6px 22px rgba(0,0,0,.28);--radius:14px;--ok:#16a34a;--ok2:#22c55e;--danger:#dc2626;--warning:#f59e0b}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#041229 0%,#071a36 100%);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
    .wrap{max-width:1400px;margin:0 auto;padding:14px}.topbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;background:#12336b;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
    .topbar h1{margin:0;font-size:18px}.btn{background:var(--btn);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
    .btn.secondary{background:#24436c}.btn.small{padding:8px 12px;font-size:12px;border-radius:10px}.btn:disabled{opacity:.55;cursor:not-allowed}
    .card{background:rgba(6,24,54,.96);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px;box-shadow:var(--shadow)}.section{margin:14px 0}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:12px 16px}.field label{display:block;font-weight:700;margin-bottom:6px}
    .select,.filebox,.statusbar{width:100%;background:#173a6c;color:#fff;border:1px solid #2e548e;border-radius:14px;padding:14px 16px;font-size:16px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.muted{color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:8px;background:#183866;border-radius:999px;padding:10px 14px;color:#fff}
    .hint{background:#173a6c;border-radius:16px;padding:12px 16px;color:#d9e5ff}.table-wrap{overflow:auto;border:1px solid rgba(255,255,255,.08);border-radius:16px;margin-top:12px}
    table{width:100%;border-collapse:collapse;min-width:1100px;background:#082048}th,td{padding:12px 10px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;vertical-align:middle}
    th{position:sticky;top:0;background:#0b2a59;z-index:1;white-space:nowrap}tr:hover td{background:rgba(255,255,255,.02)}.chk{width:18px;height:18px}
    .img-thumb{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#0f2341}.sem-img{font-size:12px;color:#cfd8ea}
    .desc-main{display:block;font-weight:800;color:#fff;line-height:1.25}.desc-original{display:block;font-size:12px;color:#b8c7df;line-height:1.25;margin-top:4px}
    .toolbar-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}.pages{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}
    @media (max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media (max-width:640px){.grid{grid-template-columns:1fr}.wrap{padding:8px}.topbar h1{font-size:16px}.btn{padding:10px 14px}th,td{padding:10px 8px}}
  </style>
</head>
<body>
  <div class="topbar"><h1>Pré-visualização Contêiner</h1><button class="btn secondary small" onclick="fecharPreview()">Fechar</button></div>
  <div class="wrap">
    <div class="card section">
      <div class="actions"><label class="btn" for="arquivoInput">Escolher arquivos</label><input id="arquivoInput" type="file" accept=".xls,.xlsx,.csv,.pdf" class="hidden"><button id="btnAnalisar" class="btn">Analisar</button></div>
      <div id="arquivoNome" class="statusbar" style="margin-top:10px">Aguardando arquivo...</div>
      <div class="muted" style="margin-top:8px">Selecione XLS, XLSX, CSV ou PDF.</div>
    </div>

    <div class="card section">
      <div class="grid">
        <div class="field"><label>Código</label><select id="mapCodigo" class="select"></select></div>
        <div class="field"><label>Produto</label><select id="mapProduto" class="select"></select></div>
        <div class="field"><label>Container</label><select id="mapContainer" class="select"></select></div>
        <div class="field"><label>Lote</label><select id="mapLote" class="select"></select></div>
        <div class="field"><label>Caixas</label><select id="mapCaixas" class="select"></select></div>
        <div class="field"><label>Unidades</label><select id="mapUnidades" class="select"></select></div>
        <div class="field"><label>Fator (Q/C)</label><select id="mapFator" class="select"></select></div>
        <div class="field"><label>NF</label><select id="mapNf" class="select"></select></div>
        <div class="field"><label>Fornecedor</label><select id="mapFornecedor" class="select"></select></div>
        <div class="field"><label>Imagem</label><select id="mapImagem" class="select"></select></div>
      </div>

      <div class="toolbar-row">
        <button class="btn small" onclick="selecionarPagina()">Selecionar página</button>
        <button class="btn secondary small" onclick="desmarcarPagina()">Desmarcar página</button>
        <button class="btn small" onclick="selecionarTodas()">Selecionar todas</button>
        <button class="btn secondary small" onclick="desmarcarTodas()">Desmarcar todas</button>
        <span id="infoLinhas" class="pill">0 linhas</span>
      </div>

      <div class="toolbar-row">
        <div class="pages"><button class="btn secondary small" onclick="moverHorizontal(-1)">◀ Esquerda</button><button class="btn secondary small" onclick="moverHorizontal(1)">Direita ▶</button><button class="btn secondary small" onclick="irInicio()">Início</button><button class="btn secondary small" onclick="irFim()">Fim</button></div>
        <div class="hint">Para mover colunas no celular, toque e segure no cabeçalho por um instante e arraste.</div>
      </div>

      <div class="table-wrap" id="tableWrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>

      <div class="toolbar-row">
        <button class="btn secondary small" onclick="paginaAnterior()">Anterior</button>
        <button class="btn secondary small" onclick="proximaPagina()">Próxima</button>
        <span id="paginaInfo" class="pill">Página 1</span>
        <span class="muted">Por página</span>
        <select id="porPagina" class="select" style="max-width:110px;padding:10px 12px"><option>20</option><option>50</option><option selected>100</option><option>200</option></select>
      </div>

      <div class="actions" style="margin-top:16px"><button id="btnImportar" class="btn">Importar Contêiner</button></div>
      <div id="msgFinal" class="statusbar hidden" style="margin-top:12px"></div>
    </div>
  </div>

  <script>
    const state = { arquivo:null, arquivoNome:"", abas:[], abaAtual:"", planilhas:{}, metadados:{}, headers:[], rows:[], selecionados:new Set(), pagina:1, porPagina:100, dragIndex:null, touchDragIndex:null, touchLongPressTimer:null };
    const mapIds = { codigo:"mapCodigo", produto:"mapProduto", container:"mapContainer", lote:"mapLote", caixas:"mapCaixas", unidades:"mapUnidades", fator:"mapFator", nf:"mapNf", fornecedor:"mapFornecedor", imagem:"mapImagem" };
    const arquivoInput = document.getElementById("arquivoInput");
    const arquivoNome = document.getElementById("arquivoNome");
    const btnAnalisar = document.getElementById("btnAnalisar");
    const btnImportar = document.getElementById("btnImportar");
    const tbody = document.getElementById("tbody");
    const thead = document.getElementById("thead");
    const infoLinhas = document.getElementById("infoLinhas");
    const paginaInfo = document.getElementById("paginaInfo");
    const porPagina = document.getElementById("porPagina");
    const msgFinal = document.getElementById("msgFinal");
    const tableWrap = document.getElementById("tableWrap");

    arquivoInput.addEventListener("change", () => {
      state.arquivo = arquivoInput.files[0] || null;
      state.arquivoNome = state.arquivo ? state.arquivo.name : "";
      arquivoNome.textContent = state.arquivoNome || "Aguardando arquivo...";
    });
    btnAnalisar.addEventListener("click", analisar);
    btnImportar.addEventListener("click", importar);
    porPagina.addEventListener("change", () => { state.porPagina = Number(porPagina.value || 100); state.pagina = 1; renderTabela(); });

    function fecharPreview(){ window.location.href = "/"; }
    function htmlEscape(str=""){ return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }
    function getSelectValue(key){ const el = document.getElementById(mapIds[key]); return el ? el.value : ""; }

    function popularMaps() {
      const headers = state.headers;
      const detected = ((state.metadados[state.abaAtual] || {}).camposDetectados) || {};
      const opts = ['<option value="">-- não usar --</option>'].concat(headers.map(h => `<option value="${htmlEscape(h)}">${htmlEscape(h)}</option>`)).join("");
      Object.entries(mapIds).forEach(([campo,id]) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.innerHTML = opts;
        if (detected[campo]) el.value = detected[campo];
      });
    }

    async function analisar() {
      if (!state.arquivo) return alert("Selecione um arquivo primeiro.");
      btnAnalisar.disabled = true; btnAnalisar.textContent = "Analisando...";
      try {
        const fd = new FormData();
        fd.append("arquivo", state.arquivo); fd.append("file", state.arquivo);
        const res = await fetch("/api/importar-container", { method:"POST", body:fd });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.erro || "Erro ao analisar contêiner.");
        state.abas = Array.isArray(data.abas) ? data.abas : [];
        state.planilhas = data.planilhas || {};
        state.metadados = data.metadados || {};
        state.abaAtual = state.abas[0] || "";
        state.rows = state.planilhas[state.abaAtual] || [];
        state.headers = ((state.metadados[state.abaAtual] || {}).cabecalhos || []).filter(h => h !== "__excelRow");
        state.selecionados = new Set(state.rows.map((_, idx) => idx));
        state.pagina = 1;
        popularMaps(); renderTabela();
      } catch (err) {
        console.error(err); alert(err.message || "Erro ao analisar.");
      } finally { btnAnalisar.disabled = false; btnAnalisar.textContent = "Analisar"; }
    }

    function getDisplayDescription(row) {
      const translated = (row.descricao_traduzida || row.traducao || "").trim();
      const original = (row.descricao_original || row.DESCRIPTION || row["品名"] || "").trim();
      if (translated && original && translated !== original) {
        return `<span class="desc-main">${htmlEscape(translated)}</span><span class="desc-original">${htmlEscape(original)}</span>`;
      }
      return `<span class="desc-main">${htmlEscape(translated || original || "")}</span>`;
    }

    function getImageHtml(row) {
      const selectedHeader = getSelectValue("imagem");
      const value = row.imagem || row.Imagem || row.IMAGEM || row.image || row.Image || row.IMAGE || row.picture || row.Picture || row.PICTURE || (selectedHeader ? row[selectedHeader] : "");
      const codigoHeader = getSelectValue("codigo");
      const codigo = codigoHeader ? row[codigoHeader] : row["ITEM NO"] || row.codigo || "";
      if (value && String(value).trim()) {
        let src = String(value).trim();
        if (!src.startsWith("http") && !src.startsWith("/uploads") && !src.startsWith("data:image")) src = `/uploads/produtos/${src}`;
        return `<img class="img-thumb" src="${htmlEscape(src)}" alt="imagem" onerror="this.outerHTML='<span class=&quot;sem-img&quot;>Sem imagem</span>'">`;
      }
      if (codigo) {
        const fallback = `/uploads/produtos/${encodeURIComponent(String(codigo).trim())}.png`;
        return `<img class="img-thumb" src="${htmlEscape(fallback)}" alt="imagem" onerror="this.outerHTML='<span class=&quot;sem-img&quot;>Sem imagem</span>'">`;
      }
      return `<span class="sem-img">Sem imagem</span>`;
    }

    function isChecked(realIndex){ return state.selecionados.has(realIndex); }
    function toggleChecked(realIndex, checked){ if (checked) state.selecionados.add(realIndex); else state.selecionados.delete(realIndex); atualizarInfo(); }
    function getRowsPagina(){ const ini=(state.pagina-1)*state.porPagina, fim=ini+state.porPagina; return state.rows.slice(ini,fim).map((row,idx)=>({row,realIndex:ini+idx})); }

    function renderTabela() {
      const rowsPagina = getRowsPagina();
      const columns = [...state.headers];
      thead.innerHTML = `<tr><th style="width:42px"></th>${columns.map((h, idx) => `<th draggable="true" data-index="${idx}" ondragstart="onDragStart(event)" ondragover="onDragOver(event)" ondrop="onDrop(event)" ontouchstart="onTouchStartHeader(event)" ontouchend="onTouchEndHeader(event)" ontouchmove="onTouchMoveHeader(event)">${htmlEscape(h)}</th>`).join("")}</tr>`;
      tbody.innerHTML = rowsPagina.map(({row, realIndex}) => `<tr><td><input class="chk" type="checkbox" ${isChecked(realIndex)?"checked":""} onchange="toggleLinha(${realIndex}, this.checked)"></td>${columns.map((h)=>renderCell(h,row)).join("")}</tr>`).join("");
      paginaInfo.textContent = `Página ${state.pagina}`; atualizarInfo();
    }

    function renderCell(header, row) {
      const h = String(header || "").toUpperCase();
      if (h === "PICTURE" || h.includes("IMAGE") || h.includes("IMAGEM")) return `<td>${getImageHtml(row)}</td>`;
      const selectedProduto = getSelectValue("produto");
      if (selectedProduto && header === selectedProduto) return `<td>${getDisplayDescription(row)}</td>`;
      return `<td>${htmlEscape(row[header] ?? "")}</td>`;
    }

    function atualizarInfo(){ infoLinhas.textContent = `${state.rows.length} linhas • ${state.selecionados.size} selecionadas • aba ${state.abaAtual || "-"}`; }
    function toggleLinha(realIndex, checked){ toggleChecked(realIndex, checked); }
    function selecionarPagina(){ getRowsPagina().forEach(({realIndex})=>state.selecionados.add(realIndex)); renderTabela(); }
    function desmarcarPagina(){ getRowsPagina().forEach(({realIndex})=>state.selecionados.delete(realIndex)); renderTabela(); }
    function selecionarTodas(){ state.selecionados = new Set(state.rows.map((_,idx)=>idx)); renderTabela(); }
    function desmarcarTodas(){ state.selecionados.clear(); renderTabela(); }
    function paginaAnterior(){ if (state.pagina > 1) { state.pagina -= 1; renderTabela(); } }
    function proximaPagina(){ const total = Math.max(1, Math.ceil(state.rows.length / state.porPagina)); if (state.pagina < total) { state.pagina += 1; renderTabela(); } }
    function moverHorizontal(dir){ tableWrap.scrollLeft += dir * 240; }
    function irInicio(){ tableWrap.scrollLeft = 0; }
    function irFim(){ tableWrap.scrollLeft = tableWrap.scrollWidth; }
    function onDragStart(ev){ state.dragIndex = Number(ev.target.dataset.index); }
    function onDragOver(ev){ ev.preventDefault(); }
    function onDrop(ev){ ev.preventDefault(); const targetIndex = Number(ev.target.closest("th")?.dataset.index); if (Number.isNaN(state.dragIndex) || Number.isNaN(targetIndex) || state.dragIndex === targetIndex) return; const arr=[...state.headers]; const [item]=arr.splice(state.dragIndex,1); arr.splice(targetIndex,0,item); state.headers=arr; state.dragIndex=null; renderTabela(); }
    function onTouchStartHeader(ev){ const th = ev.target.closest("th"); if (!th) return; const idx = Number(th.dataset.index); clearTimeout(state.touchLongPressTimer); state.touchLongPressTimer = setTimeout(()=>{ state.touchDragIndex = idx; }, 250); }
    function onTouchMoveHeader(ev){ if (state.touchDragIndex == null) return; const touch = ev.touches[0]; const target = document.elementFromPoint(touch.clientX, touch.clientY); const th = target?.closest?.("th"); if (!th) return; const targetIndex = Number(th.dataset.index); if (Number.isNaN(targetIndex) || targetIndex === state.touchDragIndex) return; const arr=[...state.headers]; const [item]=arr.splice(state.touchDragIndex,1); arr.splice(targetIndex,0,item); state.headers=arr; state.touchDragIndex=targetIndex; renderTabela(); }
    function onTouchEndHeader(){ clearTimeout(state.touchLongPressTimer); state.touchDragIndex = null; }

    async function importar() {
      const itens = Array.from(state.selecionados).map(i => state.rows[i]).filter(Boolean);
      if (!itens.length) return alert("Nenhum item selecionado.");
      const campos = {}; Object.keys(mapIds).forEach(k => campos[k] = getSelectValue(k));
      const camposDetectados = ((state.metadados[state.abaAtual] || {}).camposDetectados) || {};
      btnImportar.disabled = true; btnImportar.textContent = "Importando...";
      try {
        const res = await fetch("/api/estoque/container", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ arquivo:state.arquivoNome, aba:state.abaAtual, itens, campos, camposDetectados }) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.erro || "Erro ao importar.");
        msgFinal.classList.remove("hidden"); msgFinal.textContent = `✔ Importação concluída. ${data.inseridos || 0} itens importados.`;
      } catch (err) {
        console.error(err); alert(err.message || "Erro ao importar.");
      } finally { btnImportar.disabled = false; btnImportar.textContent = "Importar Contêiner"; }
    }

    window.toggleLinha = toggleLinha; window.selecionarPagina = selecionarPagina; window.desmarcarPagina = desmarcarPagina; window.selecionarTodas = selecionarTodas; window.desmarcarTodas = desmarcarTodas; window.paginaAnterior = paginaAnterior; window.proximaPagina = proximaPagina; window.moverHorizontal = moverHorizontal; window.irInicio = irInicio; window.irFim = irFim; window.onDragStart = onDragStart; window.onDragOver = onDragOver; window.onDrop = onDrop; window.onTouchStartHeader = onTouchStartHeader; window.onTouchMoveHeader = onTouchMoveHeader; window.onTouchEndHeader = onTouchEndHeader; window.fecharPreview = fecharPreview;
  </script>
</body>
</html>
