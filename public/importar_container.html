<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Importar Contêiner</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="module">

  <!-- HEADER -->
  <div class="module-header">
    <h1>Pré-visualização do Contêiner</h1>
    <div class="module-sub">
      <span id="fileName"></span> • 
      <span id="sheetName"></span> • 
      <span id="totalRows"></span> linhas
    </div>
  </div>

  <!-- AÇÕES -->
  <div class="module-toolbar">
    <button onclick="toggleMap()" class="btn">Configurar colunas</button>
    <button onclick="toggleView()" class="btn">Organizar visualização</button>
  </div>

  <!-- PAINEL MAPEAMENTO -->
  <div id="mapPanel" class="panel hidden">
    <h3>Mapeamento de colunas</h3>

    <div class="grid">

      <div><input type="checkbox" checked> Código</div>
      <select id="map_codigo"></select>

      <div><input type="checkbox" checked> Produto</div>
      <select id="map_produto"></select>

      <div><input type="checkbox" checked> Caixas</div>
      <select id="map_caixas"></select>

      <div><input type="checkbox" checked> Unidades</div>
      <select id="map_unidades"></select>

      <div><input type="checkbox" checked> Imagem</div>
      <select id="map_imagem"></select>

      <div><input type="checkbox"> Container</div>
      <select id="map_container"></select>

      <div><input type="checkbox"> Lote</div>
      <select id="map_lote"></select>

      <div><input type="checkbox"> NF</div>
      <select id="map_nf"></select>

      <div><input type="checkbox"> Fornecedor</div>
      <select id="map_fornecedor"></select>

      <div><input type="checkbox"> Fator (Q/C)</div>
      <select id="map_fator"></select>

    </div>
  </div>

  <!-- PAINEL VISUAL -->
  <div id="viewPanel" class="panel hidden">
    <h3>Colunas visíveis</h3>

    <div class="grid">

      <label><input type="checkbox" checked data-col="imagem"> Imagem</label>
      <label><input type="checkbox" checked data-col="codigo"> Código</label>
      <label><input type="checkbox" checked data-col="descricao"> Descrição</label>
      <label><input type="checkbox" data-col="traducao"> Tradução</label>
      <label><input type="checkbox" data-col="caixas"> Caixas</label>
      <label><input type="checkbox" data-col="unidades"> Unidades</label>
      <label><input type="checkbox" data-col="fator"> Fator</label>
      <label><input type="checkbox" data-col="fornecedor"> Fornecedor</label>
      <label><input type="checkbox" data-col="lote"> Lote</label>
      <label><input type="checkbox" data-col="nf"> NF</label>

    </div>
  </div>

  <!-- RESUMO -->
  <div class="module-summary">
    <span id="summaryText"></span>
  </div>

  <!-- TABELA -->
  <div class="table-wrap">
    <table id="previewTable">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<script src="/js/importador.js"></script>
</body>
</html>
