<h1>🚀 Dashboard Enterprise</h1>

<div id="dados">Carregando...</div>

<script>
async function carregar() {
  try {
    const res = await fetch('/api/dashboard');
    const data = await res.json();

    document.getElementById('dados').innerHTML = `
      <p>📦 Produtos: ${data.produtos}</p>
      <p>🔄 Movimentações: ${data.movimentacoes}</p>
      <p>📍 Endereços WMS: ${data.enderecos}</p>
    `;
  } catch (e) {
    document.getElementById('dados').innerHTML = "Erro ao carregar dados";
  }
}

carregar();
</script>
