<h2>📦 Importação Inteligente</h2>

<input type="file" id="file"/>
<br>
<button onclick="preview()">Visualizar</button>

<h3>Mapeamento</h3>
<div id="map"></div>

<h3>Preview</h3>
<pre id="preview"></pre>

<button onclick="salvar()">Salvar Mapeamento</button>
<button onclick="importar()">IMPORTAR</button>

<script>
let headersGlobal = [];

async function preview(){
    const f = document.getElementById('file').files[0];
    const fd = new FormData();
    fd.append('file', f);

    const r = await fetch('/api/importacao/preview',{method:'POST',body:fd});
    const d = await r.json();

    headersGlobal = d.headers;

    document.getElementById('map').innerHTML = ['codigo','nome','fator','quantidade']
    .map(campo => `
        <div>
            ${campo}:
            <select id="${campo}">
                ${d.headers.map(h=>`<option ${d.sugestao[campo]==h?'selected':''}>${h}</option>`).join('')}
            </select>
        </div>
    `).join('');

    document.getElementById('preview').innerText =
        JSON.stringify(d.linhas,null,2);
}

async function salvar(){
    const body = {
        campos:{
            codigo:codigo.value,
            nome:nome.value,
            fator:fator.value,
            quantidade:quantidade.value
        }
    };

    await fetch('/api/importacao/mapear',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body)
    });

    alert('Mapeamento salvo!');
}

async function importar(){
    const f = document.getElementById('file').files[0];
    const fd = new FormData();

    fd.append('file', f);
    fd.append('mapeamento', JSON.stringify({
        codigo:codigo.value,
        nome:nome.value,
        fator:fator.value,
        quantidade:quantidade.value
    }));

    const r = await fetch('/api/importacao/importar',{
        method:'POST',
        body:fd
    });

    const d = await r.json();

    alert('Importado: '+d.total);
}
</script>
