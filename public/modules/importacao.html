<h2>📦 Importação</h2>
<input type="file" id="file"/>
<button onclick="enviar()">Importar</button>
<p id="res"></p>

<script>
async function enviar(){
    const f = document.getElementById('file').files[0];
    if(!f) return alert('Selecione');

    const fd = new FormData();
    fd.append('file', f);

    document.getElementById('res').innerText='Enviando...';

    const r = await fetch('/api/importacao/xlsx',{method:'POST',body:fd});
    const d = await r.json();

    document.getElementById('res').innerText='Importado: '+d.totalImportado;
}
</script>
