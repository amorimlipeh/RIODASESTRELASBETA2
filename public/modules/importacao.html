<h2>📦 Importação (Preview)</h2>

<input type="file" id="file"/>
<br>
<button onclick="preview()">Visualizar</button>

<h3>Colunas</h3>
<div id="cols"></div>

<h3>Preview</h3>
<div id="preview"></div>

<script>
async function preview(){
    const f = document.getElementById('file').files[0];
    if(!f) return alert('Selecione arquivo');

    const fd = new FormData();
    fd.append('file', f);

    document.getElementById('preview').innerText='Carregando...';

    const r = await fetch('/api/importacao/preview',{
        method:'POST',
        body:fd
    });

    const d = await r.json();

    // colunas
    document.getElementById('cols').innerHTML =
        d.headers.map(h=>`<span style="margin-right:10px">${h}</span>`).join('');

    // tabela
    document.getElementById('preview').innerHTML =
        '<pre>'+JSON.stringify(d.linhas,null,2)+'</pre>';
}
</script>
