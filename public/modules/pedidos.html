<h1>🔄 Movimentações</h1>

<ul id="lista"></ul>

<script>
async function carregar() {
  const res = await fetch('/api/movimentacoes');
  const data = await res.json();

  document.getElementById('lista').innerHTML =
    data.map(m =>
      `<li>${m.tipo} - ${m.produto} (${m.quantidade || ''})</li>`
    ).join('');
}

carregar();
</script>
