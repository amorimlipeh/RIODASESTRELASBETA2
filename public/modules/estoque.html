<h1>📦 Movimentar Estoque (WMS)</h1>

<input id="produto" placeholder="Produto">
<input id="quantidade" placeholder="Qtd">
<input id="endereco" placeholder="Endereço (05-001-3-1)">

<select id="tipo">
  <option value="entrada">Entrada</option>
  <option value="saida">Saída</option>
</select>

<button onclick="add()">Movimentar</button>

<script>
async function add() {
  await fetch('/api/movimentacoes', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      tipo: document.getElementById('tipo').value,
      produto: document.getElementById('produto').value,
      quantidade: document.getElementById('quantidade').value,
      endereco: document.getElementById('endereco').value
    })
  });

  alert("Movimentação realizada");
}
</script>
