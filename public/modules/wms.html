<h1>📍 Mapa WMS</h1>

<ul id="lista"></ul>

<script>
async function carregar() {
  const res = await fetch('/api/estoque');
  const data = await res.json();

  document.getElementById('lista').innerHTML =
    data.map(e => `
      <li>
        <b>${e.codigo}</b><br>
        ${e.estoque.map(i => `${i.produto}: ${i.quantidade}`).join('<br>')}
      </li>
    `).join('<hr>');
}

carregar();
</script>
