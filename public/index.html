<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RIO BETA 2</title>
<style>
body { margin:0; font-family:Arial; background:#0b1a2a; color:#fff; }
.sidebar { width:200px; height:100vh; background:#08121f; position:fixed; }
.sidebar button { width:100%; padding:15px; border:none; background:#0d1f35; color:#fff; }
.content { margin-left:200px; padding:20px; }
</style>
</head>
<body>

<div class="sidebar">
<button onclick="load('dashboard')">Dashboard</button>
<button onclick="load('importacao')">Importação</button>
</div>

<div class="content" id="app"></div>

<script>
async function load(p){
    const r = await fetch('/modules/'+p+'.html');
    document.getElementById('app').innerHTML = await r.text();
}
load('dashboard');
</script>

<script src="js/importacao.js?v=2"></script>
<script src="js/importacao.js?v=3"></script>
</body>
</html>
