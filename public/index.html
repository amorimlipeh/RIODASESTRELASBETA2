
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Importador</title>
<style>
body{background:#0b1e3a;color:#fff;font-family:sans-serif}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #333}
img{width:40px;height:40px;border-radius:6px}
small{opacity:.6}
</style>
</head>
<body>

<h2>Importador Contêiner</h2>

<input type="file" id="file">
<button onclick="enviar()">Analisar</button>

<table id="tabela"></table>

<script>
async function enviar(){
  const f = document.getElementById("file").files[0];
  const fd = new FormData();
  fd.append("file", f);

  const res = await fetch("/upload",{method:"POST",body:fd});
  const data = await res.json();

  render(data);
}

function render(data){
  const t = document.getElementById("tabela");
  t.innerHTML = "";

  data.forEach(l=>{
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${l.__imagem ? `<img src="${l.__imagem}">` : "—"}</td>
      <td>${l["ITEM NO"] || ""}</td>
      <td>
        ${l["DESCRIPTION"] || ""}
        <br><small>${l.__produto_original || ""}</small>
      </td>
      <td>${l["CTNS"] || ""}</td>
    `;

    t.appendChild(tr);
  });
}
</script>

</body>
</html>
