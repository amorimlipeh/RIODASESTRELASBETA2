<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RIOBETA2</title>
<style>
body{margin:0;font-family:Arial;background:#0b1220;color:#fff;display:flex}
.menu{width:220px;background:#050b18;padding:20px}
.menu button{width:100%;margin:5px 0;padding:10px;background:#1e293b;color:#fff;border:0}
.content{flex:1;padding:20px}
</style>
</head>
<body>

<div class="menu">
<h3>🚀 RIOBETA2</h3>
<button onclick="load('dashboard')">Dashboard</button>
<button onclick="load('produtos')">Produtos</button>
<button onclick="load('estoque')">Estoque</button>
<button onclick="load('mov')">Mov</button>
<button onclick="load('wms')">WMS</button>
</div>

<div class="content" id="app"></div>

<script>
async function load(p){
const a=document.getElementById('app')

if(p==='dashboard'){
const d=await fetch('/api/dashboard').then(r=>r.json())
a.innerHTML=JSON.stringify(d)
}

if(p==='produtos'){
a.innerHTML='<input id=n><button onclick=add()>+</button><div id=l></div>'
listar()
}

if(p==='estoque'){
a.innerHTML='<input id=p><input id=q><button onclick=mov()>OK</button>'
}

if(p==='mov'){
const d=await fetch('/api/mov').then(r=>r.json())
a.innerHTML=JSON.stringify(d)
}

if(p==='wms'){
a.innerHTML='<input id=e><input id=p2><button onclick=w()>+</button>'
}
}

async function add(){
await fetch('/api/produtos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:n.value})})
listar()
}

async function listar(){
const d=await fetch('/api/produtos').then(r=>r.json())
l.innerHTML=JSON.stringify(d)
}

async function mov(){
await fetch('/api/estoque',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({produto:p.value,quantidade:Number(q.value)})})
}

async function w(){
await fetch('/api/wms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endereco:e.value,produto:p2.value})})
}

load('dashboard')
</script>

</body>
</html>
