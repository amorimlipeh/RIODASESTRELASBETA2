<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importar WMS</title>

<link rel="stylesheet" href="css/style.css">

<style>
/* reaproveitando padrão container */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  display: none;
  z-index: 999;
}

.modal-content {
  background: #0b2545;
  margin: auto;
  width: 95%;
  height: 90%;
  border-radius: 12px;
  overflow: auto;
  padding: 10px;
}

.filtro-box {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #0b2545;
  padding: 10px;
  display: none;
  z-index: 1000;
}
</style>
</head>

<body>

<h2>Importador WMS</h2>

<input type="file" id="file">

<button onclick="analisar()">Analisar</button>

<!-- LOADING -->
<div class="modal" id="loadingModal">
  <div class="modal-content">
    <h3>Carregando arquivo...</h3>
  </div>
</div>

<!-- PREVIEW -->
<div class="modal" id="previewModal">
  <div class="modal-content">

    <button onclick="abrirFiltro()">Filtro</button>
    <button onclick="fecharPreview()">Fechar</button>

    <div id="tabela"></div>

  </div>
</div>

<!-- FILTRO -->
<div class="filtro-box" id="filtroBox">
  <h3>Filtro</h3>
  <div id="filtros"></div>
  <button onclick="aplicarFiltro()">Aplicar</button>
</div>

<script>
let dados = []
let colunas = []
let colunasAtivas = []

async function analisar() {
  document.getElementById("loadingModal").style.display = "flex"

  const file = document.getElementById("file").files[0]

  const formData = new FormData()
  formData.append("file", file)

  const res = await fetch("/api/importar-wms", {
    method: "POST",
    body: formData
  })

  const json = await res.json()

  dados = json.dados
  colunas = json.colunas
  colunasAtivas = [...colunas]

  montarTabela()
  montarFiltro()

  document.getElementById("loadingModal").style.display = "none"
  document.getElementById("previewModal").style.display = "flex"
}

function montarTabela() {
  let html = "<table><tr>"

  colunasAtivas.forEach(c => {
    html += `<th>${c}</th>`
  })

  html += "</tr>"

  dados.forEach(linha => {
    html += "<tr>"
    colunasAtivas.forEach(c => {
      html += `<td>${linha[c] || ""}</td>`
    })
    html += "</tr>"
  })

  html += "</table>"

  document.getElementById("tabela").innerHTML = html
}

function montarFiltro() {
  let html = ""

  colunas.forEach(c => {
    html += `
      <label>
        <input type="checkbox" checked value="${c}">
        ${c}
      </label><br>
    `
  })

  document.getElementById("filtros").innerHTML = html
}

function abrirFiltro() {
  document.getElementById("filtroBox").style.display = "block"
}

function aplicarFiltro() {
  const checks = document.querySelectorAll("#filtros input")

  colunasAtivas = []

  checks.forEach(c => {
    if (c.checked) colunasAtivas.push(c.value)
  })

  montarTabela()
  document.getElementById("filtroBox").style.display = "none"
}

function fecharPreview() {
  document.getElementById("previewModal").style.display = "none"
}
</script>

</body>
</html>
