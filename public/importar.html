<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importador WMS</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#071a36;
  color:#fff;
}

.top{
  padding:15px;
  background:#0b2545;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.btn{
  background:#3b73e6;
  border:none;
  padding:10px 14px;
  border-radius:8px;
  color:#fff;
}

.box{
  padding:15px;
}

.badge{
  background:#1d3c66;
  padding:8px 12px;
  border-radius:20px;
  display:inline-block;
}

.actions{
  position:relative;
  display:inline-block;
}

.menu{
  display:none;
  position:absolute;
  background:#0b2545;
  padding:10px;
  border-radius:10px;
  top:40px;
  left:0;
  z-index:10;
  width:200px;
}

.menu button{
  width:100%;
  margin-bottom:6px;
  background:#102d52;
  border:none;
  padding:10px;
  border-radius:6px;
  color:#fff;
}

.menu.show{
  display:block;
}

.table{
  margin-top:10px;
  overflow:auto;
  max-height:60vh;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:10px;
  border-bottom:1px solid #1d3c66;
  text-align:left;
}

th{
  background:#0b2545;
  position:sticky;
  top:0;
}

th input{
  width:100%;
  background:#102d52;
  border:none;
  color:#fff;
  padding:4px;
  border-radius:4px;
}

tr.selected{
  background:#123a6b;
}

.loader{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:flex;
  align-items:center;
  justify-content:center;
  display:none;
}

.loader.show{
  display:flex;
}

.loader-box{
  background:#0b2545;
  padding:20px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="top">
  <div>Pré-visualização WMS</div>
  <button class="btn" onclick="fechar()">Fechar</button>
</div>

<div class="box">

<input type="file" id="file" hidden>

<button class="btn" onclick="document.getElementById('file').click()">Escolher arquivo</button>
<button class="btn" onclick="analisar()">Analisar</button>

<div id="fileName"></div>

<br><br>

<div class="actions">
  <button class="btn" onclick="toggleMenu()">Ações</button>

  <div id="menu" class="menu">
    <button onclick="selecionarPagina()">Selecionar página</button>
    <button onclick="desmarcarPagina()">Desmarcar página</button>
    <button onclick="selecionarTudo()">Selecionar todas</button>
    <button onclick="desmarcarTudo()">Desmarcar todas</button>
    <hr>
    <button onclick="scrollLeft()">⬅ Esquerda</button>
    <button onclick="scrollRight()">Direita ➡</button>
    <button onclick="scrollTopo()">Início</button>
    <button onclick="scrollFim()">Fim</button>
  </div>
</div>

<span class="badge" id="contador">0 linhas</span>

<div style="margin-top:10px;font-size:12px;">
Desktop: segure Ctrl e arraste. Mobile: segure e arraste.
</div>

<div class="table">
  <table id="tabela"></table>
</div>

</div>

<div id="loader" class="loader">
  <div class="loader-box">Carregando arquivo...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>

let dados = []
let selecionados = new Set()

document.getElementById('file').addEventListener('change', e=>{
  document.getElementById('fileName').innerText = e.target.files[0].name
})

function toggleMenu(){
  document.getElementById('menu').classList.toggle('show')
}

function analisar(){
  let file = document.getElementById('file').files[0]
  if(!file) return alert("Escolha um arquivo")

  document.getElementById('loader').classList.add('show')

  let reader = new FileReader()

  reader.onload = function(e){
    let wb = XLSX.read(e.target.result, {type:'binary'})
    let ws = wb.Sheets[wb.SheetNames[0]]
    dados = XLSX.utils.sheet_to_json(ws, {header:1})

    renderTabela()
    document.getElementById('loader').classList.remove('show')
  }

  reader.readAsBinaryString(file)
}

function renderTabela(){
  let table = document.getElementById('tabela')
  table.innerHTML = ""

  let header = dados[0]

  let tr = document.createElement('tr')

  header.forEach((h,i)=>{
    let th = document.createElement('th')

    let input = document.createElement('input')
    input.value = h
    input.onchange = ()=> header[i] = input.value

    th.appendChild(input)
    tr.appendChild(th)
  })

  table.appendChild(tr)

  dados.slice(1).forEach((row,idx)=>{
    let tr = document.createElement('tr')

    tr.onclick = ()=>{
      if(selecionados.has(idx)){
        selecionados.delete(idx)
        tr.classList.remove('selected')
      }else{
        selecionados.add(idx)
        tr.classList.add('selected')
      }
      atualizarContador()
    }

    row.forEach(cell=>{
      let td = document.createElement('td')
      td.innerText = cell
      tr.appendChild(td)
    })

    table.appendChild(tr)
  })

  atualizarContador()
}

function atualizarContador(){
  document.getElementById('contador').innerText =
    `${dados.length-1} linhas • ${selecionados.size} selecionadas`
}

function selecionarTudo(){
  selecionados = new Set(dados.slice(1).map((_,i)=>i))
  renderTabela()
}

function desmarcarTudo(){
  selecionados.clear()
  renderTabela()
}

function selecionarPagina(){ selecionarTudo() }
function desmarcarPagina(){ desmarcarTudo() }

function scrollLeft(){
  document.querySelector('.table').scrollLeft -= 200
}

function scrollRight(){
  document.querySelector('.table').scrollLeft += 200
}

function scrollTopo(){
  document.querySelector('.table').scrollTop = 0
}

function scrollFim(){
  document.querySelector('.table').scrollTop = 99999
}

function fechar(){
  location.reload()
}

</script>

</body>
</html>
