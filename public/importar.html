<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Importador WMS</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
  background:#071a36;
  color:#fff;
  font-family:Arial;
  margin:0;
  padding:20px;
}

.container{
  max-width:1200px;
  margin:auto;
}

button{
  background:#3b73e6;
  border:none;
  padding:10px 14px;
  border-radius:8px;
  color:#fff;
  cursor:pointer;
}

.top{
  display:flex;
  gap:10px;
}

input[type=file]{
  display:none;
}

.preview{
  margin-top:20px;
  background:#0b2545;
  padding:10px;
  border-radius:10px;
}

.toolbar{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.panel{
  background:#102d52;
  padding:10px;
  border-radius:8px;
  margin-bottom:10px;
}

.hidden{
  display:none;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border-bottom:1px solid #1d3c66;
  padding:8px;
  font-size:13px;
}

th{
  background:#173a6c;
}

input.rename{
  width:100%;
  padding:6px;
  border-radius:6px;
  border:none;
}
</style>
</head>

<body>

<div class="container">

<div class="top">
  <label for="fileInput">
    <button>Escolher arquivo</button>
  </label>

  <input id="fileInput" type="file" accept=".xlsx,.xls,.csv"/>

  <button onclick="analisar()">Analisar</button>
</div>

<div id="preview" class="preview hidden">

  <div class="toolbar">
    <button onclick="toggleFiltro()">Filtro</button>
    <button onclick="toggleMap()">Mapear colunas</button>
    <button onclick="toggleRename()">Renomear cabeçalhos</button>
  </div>

  <!-- FILTRO -->
  <div id="filtroPanel" class="panel hidden"></div>

  <!-- MAP -->
  <div id="mapPanel" class="panel hidden"></div>

  <!-- RENAME -->
  <div id="renamePanel" class="panel hidden"></div>

  <div class="table-wrap">
    <table id="table"></table>
  </div>

</div>

</div>

<script>

let state = {
  headers: [],
  data: [],
  renamed: {}
};

// ===== FILE =====
document.getElementById("fileInput").addEventListener("change", e=>{
  console.log("Arquivo selecionado:", e.target.files[0]?.name);
});

// ===== ANALISAR =====
function analisar(){
  const file = document.getElementById("fileInput").files[0];

  if(!file){
    alert("Selecione um arquivo");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){
    const wb = XLSX.read(e.target.result, {type:"binary"});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet, {header:1});

    state.headers = json[0];
    state.data = json.slice(1);

    render();
  };

  reader.readAsBinaryString(file);
}

// ===== RENDER =====
function render(){
  document.getElementById("preview").classList.remove("hidden");

  renderTable();
  renderRename();
}

// ===== TABLE =====
function renderTable(){
  const table = document.getElementById("table");

  table.innerHTML = "";

  // HEAD
  const thead = document.createElement("tr");

  state.headers.forEach(h=>{
    const th = document.createElement("th");
    th.innerText = state.renamed[h] || h;
    thead.appendChild(th);
  });

  table.appendChild(thead);

  // BODY
  state.data.slice(0,200).forEach(row=>{
    const tr = document.createElement("tr");

    row.forEach(cell=>{
      const td = document.createElement("td");
      td.innerText = cell;
      tr.appendChild(td);
    });

    table.appendChild(tr);
  });
}

// ===== RENAME =====
function toggleRename(){
  document.getElementById("renamePanel").classList.toggle("hidden");
}

function renderRename(){
  const panel = document.getElementById("renamePanel");

  panel.innerHTML = "";

  state.headers.forEach(h=>{
    const div = document.createElement("div");

    div.innerHTML = `
      <label>${h}</label>
      <input class="rename" value="${state.renamed[h] || h}"
        oninput="rename('${h}', this.value)" />
    `;

    panel.appendChild(div);
  });
}

function rename(original, value){
  state.renamed[original] = value;
  renderTable();
}

// ===== FILTRO =====
function toggleFiltro(){
  document.getElementById("filtroPanel").classList.toggle("hidden");
}

// ===== MAP =====
function toggleMap(){
  document.getElementById("mapPanel").classList.toggle("hidden");
}

</script>

</body>
</html>
